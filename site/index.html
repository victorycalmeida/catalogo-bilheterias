<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top 200 Bilheterias no Streaming</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <h1>Top 200 Bilheterias <span>· disponível no Brasil</span></h1>
      <p class="atualizado" id="atualizado"></p>
    </div>
    <div class="controles">
      <div class="tipos" id="tipos" role="group" aria-label="Tipos de disponibilidade"></div>
      <label class="servico">Serviço
        <select id="servico"><option value="">Todos</option></select>
      </label>
      <label class="indisponiveis"><input type="checkbox" id="indisponiveis"> Mostrar indisponíveis</label>
    </div>
    <p class="aviso" id="aviso" hidden></p>
  </header>

  <main>
    <p class="contador" id="contador"></p>
    <ol class="lista" id="lista"></ol>
  </main>

  <footer class="rodape">
    <p>Dados de streaming: JustWatch · Filmes: TMDB</p>
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
